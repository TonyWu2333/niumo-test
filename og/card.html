<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<!-- 分享卡片模板：用 1200x630（#theory / #test）或 1280x640（GitHub）截图生成 og/*.png -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&display=block" rel="stylesheet">
<style>
  :root {
    --u: min(1vw, 1.905vh);
    --bg: #f5f9fd; --tint: #eaf4fd; --ink: #26313d; --muted: #667382; --line: #e2eaf3;
    --blue: #4a9be0; --blue-d: #2f7fc4; --bubble: #bfe0fa; --yellow: #ffcf3f;
    --display: "Noto Sans SC", -apple-system, "PingFang SC", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body { background: var(--bg); display: grid; place-items: center; font-family: var(--display); color: var(--ink); position: relative; }
  .bgc { position: absolute; border-radius: 50%; }
  .c1 { width: 62vw; height: 62vw; right: -14vw; top: 50%; transform: translateY(-50%); background: var(--tint); }
  .c2 { width: calc(7 * var(--u)); height: calc(7 * var(--u)); left: 4%; bottom: 9%; border: calc(0.3 * var(--u)) solid var(--bubble); background: rgba(255,255,255,.7); }
  .c3 { width: calc(3.4 * var(--u)); height: calc(3.4 * var(--u)); left: 47%; top: 9%; border: calc(0.25 * var(--u)) solid var(--bubble); background: rgba(255,255,255,.7); }
  .card { position: relative; width: calc(100 * var(--u)); height: calc(52.5 * var(--u)); }
  .left { position: absolute; left: calc(6 * var(--u)); top: 50%; transform: translateY(-50%); width: calc(54 * var(--u)); }
  .pill { display: inline-block; font-weight: 700; font-size: calc(1.85 * var(--u)); color: var(--blue-d); background: #fff; border: calc(0.12 * var(--u)) solid var(--line); padding: calc(0.45 * var(--u)) calc(1.4 * var(--u)); border-radius: 999px; }
  h1 { font-weight: 900; font-size: calc(6.4 * var(--u)); line-height: 1.18; letter-spacing: -0.01em; margin: calc(1.8 * var(--u)) 0 calc(1.6 * var(--u)); white-space: nowrap; }
  .hl { color: var(--blue); position: relative; }
  .hl::after { content: ""; position: absolute; left: -2%; right: -2%; bottom: 0.08em; height: 0.28em; background: var(--yellow); opacity: .6; border-radius: calc(0.5 * var(--u)); z-index: -1; }
  .sub { font-weight: 700; font-size: calc(2.2 * var(--u)); color: var(--muted); }
  .url { display: flex; align-items: center; gap: calc(1 * var(--u)); margin-top: calc(3.4 * var(--u)); font-weight: 900; font-size: calc(2.3 * var(--u)); color: var(--ink); }
  .url i { width: calc(2.6 * var(--u)); height: calc(2.6 * var(--u)); border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0 22%, var(--bubble) 23% 100%); border: calc(0.22 * var(--u)) solid var(--blue); display: inline-block; }
  .url span { color: var(--muted); font-weight: 500; font-size: calc(1.8 * var(--u)); margin-left: calc(0.6 * var(--u)); }
  .by { margin-top: calc(1 * var(--u)); font-weight: 500; font-size: calc(1.8 * var(--u)); color: var(--muted); padding-left: calc(3.6 * var(--u)); }
  .pic { position: absolute; background: #fff; border-radius: calc(3 * var(--u)); overflow: hidden; border: calc(0.12 * var(--u)) solid var(--line); box-shadow: 0 calc(1.8 * var(--u)) calc(4 * var(--u)) rgba(38, 80, 120, 0.16); }
  .pic img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 57%; }
  /* theory: two stacked cards */
  .theory .p1 { width: calc(28 * var(--u)); height: calc(35 * var(--u)); right: calc(7 * var(--u)); top: calc(9 * var(--u)); transform: rotate(-4deg); z-index: 2; }
  .theory .p2 { width: calc(19 * var(--u)); height: calc(23.75 * var(--u)); right: calc(29 * var(--u)); top: calc(22 * var(--u)); transform: rotate(7deg); z-index: 1; }
  /* test: 2x2 grid */
  .grid { position: absolute; right: calc(6 * var(--u)); top: 50%; transform: translateY(-50%); display: grid; grid-template-columns: repeat(2, calc(16.5 * var(--u))); gap: calc(1.6 * var(--u)); }
  .grid .pic { position: relative; height: calc(20.6 * var(--u)); }
  .grid .pic:nth-child(1) { transform: rotate(-3deg); }
  .grid .pic:nth-child(2) { transform: rotate(2deg) translateY(calc(1.2 * var(--u))); }
  .grid .pic:nth-child(3) { transform: rotate(2deg) translateY(calc(-0.6 * var(--u))); }
  .grid .pic:nth-child(4) { transform: rotate(-2deg) translateY(calc(0.6 * var(--u))); }
  .variant { display: none; }
</style>
</head>
<body>
  <div class="bgc c1"></div><div class="bgc c2"></div><div class="bgc c3"></div>

  <div class="card variant theory" id="theory">
    <div class="left">
      <span class="pill">牛膜理论</span>
      <h1>做人可以牛马，<br>但不能没有<span class="hl">牛膜</span>。</h1>
      <p class="sub">四层结构 · 三大定律 · 16 种牛膜人格</p>
      <p class="url"><i></i>niumo.tonywu.top</p>
    </div>
    <div class="pic p2"><img src="../img/types/OSEW.webp" alt=""></div>
    <div class="pic p1"><img src="../img/types/BFIH.webp" alt=""></div>
  </div>

  <div class="card variant test" id="test">
    <div class="left">
      <span class="pill">NMTI · 牛膜人格测试</span>
      <h1>你是哪种<br><span class="hl">牛膜人格</span>？</h1>
      <p class="sub">20 道题 · 3 分钟 · 16 种牛膜人格</p>
      <p class="url"><i></i>niumo.tonywu.top</p>
    </div>
    <div class="grid">
      <div class="pic"><img src="../img/types/BFIH.webp" alt=""></div>
      <div class="pic"><img src="../img/types/BSEH.webp" alt=""></div>
      <div class="pic"><img src="../img/types/OFEH.webp" alt=""></div>
      <div class="pic"><img src="../img/types/OSEW.webp" alt=""></div>
    </div>
  </div>

<script>
  var v = (location.hash || '#theory').slice(1);
  document.getElementById(v).style.display = 'block';
</script>
</body>
</html>
